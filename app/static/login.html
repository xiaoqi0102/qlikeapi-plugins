<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>登录 · qlikeapi-plugins</title>
<link rel="stylesheet" href="/static/vendor/bootstrap.min.css">
<link rel="stylesheet" href="/static/vendor/tabler-icons/tabler-icons.min.css">
<link rel="stylesheet" href="/static/css/tokens.css">
<link rel="stylesheet" href="/static/css/ui-kit.css">
</head>
<body>
<div class="login-wrap">
  <form class="login-card" id="f">
    <div class="logo-lg"><i class="ti ti-arrows-shuffle"></i></div>
    <h1>qlikeapi-plugins</h1>
    <div class="sub">图片协议转换网关 · 控制台</div>

    <div class="mb-3">
      <label class="form-label">用户名</label>
      <div class="input-group">
        <span class="input-group-text bg-white"><i class="ti ti-user"></i></span>
        <input class="form-control" name="username" autocomplete="username" placeholder="请输入用户名" required autofocus>
      </div>
    </div>
    <div class="mb-4">
      <label class="form-label">密码</label>
      <div class="input-group">
        <span class="input-group-text bg-white"><i class="ti ti-lock"></i></span>
        <input class="form-control" name="password" type="password" autocomplete="current-password" placeholder="请输入密码" required>
      </div>
    </div>

    <button class="btn btn-primary w-100 justify-content-center py-2" type="submit">
      <i class="ti ti-login"></i> 登 录
    </button>
    <div class="hint mt-3 mb-0" id="msg" style="min-height:18px"></div>
  </form>
</div>
<script src="/static/js/ui-kit.js"></script>
<script>
document.getElementById('f').addEventListener('submit', async (e) => {
  e.preventDefault();
  const msg = document.getElementById('msg');
  msg.className = 'hint mt-3 mb-0';
  msg.textContent = '';
  const fd = new FormData(e.target);
  try {
    const r = await fetch('/api/login', {
      method: 'POST', headers: {'Content-Type': 'application/json'},
      body: JSON.stringify({username: fd.get('username'), password: fd.get('password')})
    });
    const d = await r.json();
    if (r.ok) location.href = '/';
    else { msg.style.color = 'var(--err)'; msg.textContent = d.error || '登录失败'; }
  } catch (err) { msg.style.color = 'var(--err)'; msg.textContent = '网络错误：' + err.message; }
});
</script>
</body>
</html>
