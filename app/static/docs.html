<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Qlike 中转站 API 接口说明</title>
<link rel="icon" type="image/svg+xml" href="/static/favicon.svg">
<script src="/static/vendor/marked.min.js"></script>
<style>
  :root{
    --bg:#f6f7f9; --card:#fff; --fg:#1f2937; --muted:#6b7280; --line:#e5e7eb;
    --brand:#2563eb; --brand-soft:#eef2ff; --code-bg:#f3f4f6; --code-fg:#111827;
    --ok:#059669; --warn:#b45309; --radius:10px;
  }
  body.dark{
    --bg:#0f1115; --card:#171a21; --fg:#e5e7eb; --muted:#9ca3af; --line:#262b36;
    --brand:#60a5fa; --brand-soft:#1b2333; --code-bg:#11141a; --code-fg:#e5e7eb;
    --ok:#34d399; --warn:#fbbf24;
  }
  *{box-sizing:border-box}
  body{margin:0;background:var(--bg);color:var(--fg);
    font:15px/1.75 -apple-system,BlinkMacSystemFont,"Segoe UI","PingFang SC","Microsoft YaHei",sans-serif}
  a{color:var(--brand)}
  header.top{position:sticky;top:0;z-index:20;background:var(--card);border-bottom:1px solid var(--line);
    display:flex;align-items:center;gap:12px;padding:10px 20px;flex-wrap:wrap}
  header.top .logo{width:26px;height:26px}
  header.top h1{font-size:16px;margin:0;font-weight:600}
  header.top .ver{color:var(--muted);font-size:12px}
  header.top .spacer{flex:1}
  .btn{display:inline-flex;align-items:center;gap:6px;border:1px solid var(--line);background:var(--card);
    color:var(--fg);border-radius:8px;padding:6px 12px;font-size:13px;cursor:pointer;text-decoration:none}
  .btn:hover{border-color:var(--brand);color:var(--brand)}
  .btn.primary{background:var(--brand);border-color:var(--brand);color:#fff}
  .btn.primary:hover{opacity:.92;color:#fff}
  .wrap{display:flex;gap:28px;max-width:1280px;margin:0 auto;padding:24px 20px 80px;align-items:flex-start}
  nav.toc{position:sticky;top:72px;width:250px;flex:0 0 250px;max-height:calc(100vh - 100px);overflow:auto;
    background:var(--card);border:1px solid var(--line);border-radius:var(--radius);padding:14px 12px;font-size:13px}
  nav.toc .t{font-weight:600;color:var(--muted);font-size:12px;letter-spacing:.04em;margin:0 0 8px 6px}
  nav.toc a{display:block;color:var(--fg);text-decoration:none;padding:4px 6px;border-radius:6px;line-height:1.5}
  nav.toc a:hover{background:var(--brand-soft);color:var(--brand)}
  nav.toc a.l3{padding-left:18px;color:var(--muted);font-size:12.5px}
  main{flex:1;min-width:0;background:var(--card);border:1px solid var(--line);border-radius:var(--radius);
    padding:28px 34px;overflow-wrap:break-word}
  main h1{font-size:26px;margin:0 0 6px}
  main h2{font-size:19px;margin:34px 0 10px;padding-top:14px;border-top:1px solid var(--line)}
  main h2:first-of-type{border-top:0}
  main h3{font-size:16px;margin:24px 0 8px}
  main p,main li{color:var(--fg)}
  main blockquote{margin:12px 0;padding:8px 14px;border-left:3px solid var(--brand);background:var(--brand-soft);
    color:var(--fg);border-radius:0 8px 8px 0}
  main blockquote p{margin:4px 0}
  table{width:100%;border-collapse:collapse;margin:12px 0;font-size:13.5px;display:block;overflow-x:auto}
  th,td{border:1px solid var(--line);padding:7px 10px;text-align:left;vertical-align:top}
  th{background:var(--code-bg);font-weight:600;white-space:nowrap}
  code{background:var(--code-bg);color:var(--code-fg);padding:1.5px 5px;border-radius:5px;
    font:12.8px/1.5 ui-monospace,SFMono-Regular,Menlo,Consolas,monospace}
  pre{position:relative;background:var(--code-bg);border:1px solid var(--line);border-radius:8px;
    padding:12px 14px;overflow:auto;margin:12px 0}
  pre code{background:none;padding:0;font-size:12.8px;line-height:1.6}
  pre .cp{position:absolute;top:6px;right:6px;font-size:11.5px;padding:3px 8px;border-radius:6px;
    border:1px solid var(--line);background:var(--card);color:var(--muted);cursor:pointer;opacity:.85}
  pre .cp:hover{color:var(--brand);border-color:var(--brand)}
  hr{border:0;border-top:1px solid var(--line);margin:26px 0}
  .load{color:var(--muted);padding:40px 0;text-align:center}
  .foot{color:var(--muted);font-size:12.5px;margin-top:34px;padding-top:14px;border-top:1px solid var(--line)}
  @media (max-width:960px){ .wrap{flex-direction:column} nav.toc{position:static;width:auto;flex:none;max-height:none}
    main{padding:20px} }
</style>
</head>
<body>
<header class="top">
  <img class="logo" src="/static/favicon.svg" alt="">
  <h1>Qlike 中转站 API 接口说明</h1>
  <span class="ver" id="verTag"></span>
  <span class="spacer"></span>
  <a class="btn primary" href="/api-docs.md?download=1"><span>⤓</span> 下载 Markdown</a>
  <a class="btn" href="/api-docs.md" target="_blank" rel="noopener"><span>⌨</span> 查看源码</a>
  <button class="btn" onclick="copyAll(this)"><span>⧉</span> 复制全文</button>
  <button class="btn" onclick="toggleTheme()" id="thBtn">◐ 主题</button>
</header>
<div class="wrap">
  <nav class="toc"><div class="t">目录</div><div id="toc"></div></nav>
  <main id="doc"><div class="load">加载中…</div></main>
</div>
<script>
let MD = '';
const $$ = (s, r=document) => Array.from(r.querySelectorAll(s));

function slug(s){ return s.trim().toLowerCase().replace(/[^\w\u4e00-\u9fa5]+/g,'-').replace(/^-|-$/g,'') || 's'; }

function render(){
  marked.setOptions({gfm:true, breaks:false});
  const html = marked.parse(MD);
  const box = document.getElementById('doc');
  box.innerHTML = html;
  // 标题锚点 + 目录
  const toc = document.getElementById('toc');
  let items = [];
  $$('#doc h2, #doc h3').forEach((h, i) => {
    const id = 'h' + i + '-' + slug(h.textContent);
    h.id = id;
    items.push(`<a class="${h.tagName === 'H3' ? 'l3' : ''}" href="#${id}">${h.textContent}</a>`);
  });
  toc.innerHTML = items.join('') || '<div class="load">（无目录）</div>';
  // 代码块复制按钮
  $$('#doc pre').forEach(pre => {
    const b = document.createElement('button');
    b.className = 'cp'; b.textContent = '复制';
    b.onclick = () => { navigator.clipboard.writeText(pre.querySelector('code') ? pre.querySelector('code').innerText : pre.innerText)
      .then(() => { b.textContent = '已复制'; setTimeout(() => b.textContent = '复制', 1200); }); };
    pre.appendChild(b);
  });
  const m = /^>\s*\*\*版本\*\*：(\S+)/m.exec(MD);
  document.getElementById('verTag').textContent = m ? m[1] : '';
}
function copyAll(btn){
  navigator.clipboard.writeText(MD).then(() => { const o = btn.innerHTML; btn.innerHTML = '<span>✓</span> 已复制';
    setTimeout(() => btn.innerHTML = o, 1200); });
}
function toggleTheme(){
  document.body.classList.toggle('dark');
  try { localStorage.setItem('ql_docs_theme', document.body.classList.contains('dark') ? 'dark' : 'light'); } catch(e){}
}
try { if (localStorage.getItem('ql_docs_theme') === 'dark') document.body.classList.add('dark'); } catch(e){}
fetch('/api-docs.md').then(r => r.text()).then(t => { MD = t; render(); })
  .catch(e => { document.getElementById('doc').innerHTML = '<div class="load">文档加载失败：' + e + '</div>'; });
</script>
</body>
</html>
