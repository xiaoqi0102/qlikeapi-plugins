<style>
  /* ========== 主题变量：默认浅色，跟随系统，可手动切换 ========== */
  :root{
    --bg:#f4f6f8; --bg-tint:rgba(37,99,235,.05);
    --card:#ffffff; --card-2:#fafbfc;
    --fg:#18212f; --fg-2:#48546a; --muted:#7c879a;
    --line:#e6e9ef; --line-2:#eff2f6;
    --brand:#0b69ff; --brand-2:#0a58d6; --brand-soft:#eaf1ff;
    --code-bg:#f7f8fa; --code-fg:#26303f;
    --ok:#0a8f5b; --warn:#a96500; --danger:#c0392b;
    --shadow:0 1px 2px rgba(16,24,40,.04), 0 8px 24px -12px rgba(16,24,40,.14);
    --radius:14px; --radius-sm:9px;
    --mono:ui-monospace,SFMono-Regular,"SF Mono",Menlo,Consolas,"Liberation Mono",monospace;
    --sans:-apple-system,BlinkMacSystemFont,"SF Pro Text","PingFang SC","Hiragino Sans GB","Microsoft YaHei",system-ui,sans-serif;
  }
  body.dark{
    --bg:#0d1117; --bg-tint:rgba(88,166,255,.06);
    --card:#151b23; --card-2:#111721;
    --fg:#e8edf4; --fg-2:#b3bdcc; --muted:#8b96a8;
    --line:#232c39; --line-2:#1b2330;
    --brand:#5aa2ff; --brand-2:#7ab4ff; --brand-soft:#16233a;
    --code-bg:#0f1520; --code-fg:#dbe4f0;
    --ok:#3ddc97; --warn:#f5c451; --danger:#ff8080;
    --shadow:0 1px 2px rgba(0,0,0,.3), 0 10px 30px -14px rgba(0,0,0,.6);
  }
  *{box-sizing:border-box}
  html{scroll-behavior:smooth}
  body{margin:0;background:var(--bg);color:var(--fg);font:15.5px/1.78 var(--sans);
    -webkit-font-smoothing:antialiased;text-rendering:optimizeLegibility}
  a{color:var(--brand);text-decoration:none}
  a:hover{text-decoration:underline}
  ::selection{background:var(--brand);color:#fff}

  /* ========== 顶部：阅读进度 + 玻璃工具条 ========== */
  #prog{position:fixed;top:0;left:0;height:2.5px;width:0;background:linear-gradient(90deg,var(--brand),#7cc0ff);
    z-index:60;transition:width .12s linear}
  header.top{position:sticky;top:0;z-index:50;background:color-mix(in srgb,var(--card) 88%,transparent);
    backdrop-filter:saturate(180%) blur(14px);-webkit-backdrop-filter:saturate(180%) blur(14px);
    border-bottom:1px solid var(--line)}
  .top-in{max-width:1240px;margin:0 auto;display:flex;align-items:center;gap:12px;padding:11px 22px;flex-wrap:wrap}
  .brand{display:flex;align-items:center;gap:10px;min-width:0}
  .brand img{width:27px;height:27px;border-radius:7px;flex:none}
  .brand h1{font-size:15.5px;font-weight:650;margin:0;white-space:nowrap;letter-spacing:-.01em}
  .ver{font:11.5px/1.5 var(--mono);color:var(--brand);background:var(--brand-soft);
    border:1px solid color-mix(in srgb,var(--brand) 22%,transparent);border-radius:999px;padding:2px 9px;white-space:nowrap}
  .spacer{flex:1 1 auto}
  .tbtn{display:inline-flex;align-items:center;gap:6px;border:1px solid var(--line);background:var(--card);
    color:var(--fg-2);border-radius:999px;padding:6px 13px;font-size:13px;font-weight:500;cursor:pointer;
    font-family:var(--sans);transition:.15s}
  .tbtn:hover{color:var(--brand);border-color:color-mix(in srgb,var(--brand) 45%,transparent);
    background:var(--brand-soft);text-decoration:none}
  /* 主行动：重点色浅底 + 重点色字，比实心蓝克制，但仍是首屏第一眼 */
  .tbtn.primary{background:var(--brand);border-color:var(--brand);color:#fff;font-weight:600;
    box-shadow:0 1px 2px rgba(11,105,255,.32)}
  .tbtn.primary:hover{background:var(--brand-2);border-color:var(--brand-2);color:#fff}
  .tbtn .i{font-size:14px;line-height:1}
  #menuBtn{display:none}

  /* ========== 布局 ========== */
  .wrap{max-width:1240px;margin:0 auto;padding:26px 22px 90px;display:flex;gap:30px;align-items:flex-start}

  /* 目录卡 */
  nav.toc{position:sticky;top:78px;flex:0 0 258px;width:258px;
    max-height:calc(100vh - 108px);display:flex;flex-direction:column;
    background:var(--card);border:1px solid var(--line);border-radius:var(--radius);
    box-shadow:var(--shadow);overflow:hidden}
  nav.toc .head{padding:13px 14px 11px;border-bottom:1px solid var(--line-2)}
  nav.toc .head .row{display:flex;align-items:baseline;gap:8px;margin-bottom:9px}
  nav.toc .head .t{font-size:12px;font-weight:700;letter-spacing:.08em;color:var(--muted);text-transform:uppercase}
  nav.toc .head .n{margin-left:auto;font-size:11.5px;color:var(--muted)}
  .filter{width:100%;border:1px solid var(--line);background:var(--card);color:var(--fg);
    border-radius:10px;padding:8px 12px;font:13px var(--sans);outline:none;transition:.18s;
    box-shadow:inset 0 1px 2px rgba(16,24,40,.03)}
  .filter::placeholder{color:var(--muted);opacity:.85}
  .filter:focus{border-color:var(--brand);background:var(--card);
    box-shadow:0 0 0 3px color-mix(in srgb,var(--brand) 14%,transparent)}
  nav.toc .list{overflow:auto;padding:8px 8px 12px;scrollbar-width:thin}
  nav.toc a{position:relative;display:block;color:var(--fg-2);padding:6px 10px 6px 12px;border-radius:8px;
    font-size:13.2px;line-height:1.5;transition:.13s}
  nav.toc a:hover{background:var(--brand-soft);color:var(--brand);text-decoration:none}
  nav.toc a.on{background:var(--brand-soft);color:var(--brand);font-weight:600}
  nav.toc a.on::before{content:"";position:absolute;left:0;top:6px;bottom:6px;width:3px;
    border-radius:3px;background:var(--brand)}
  nav.toc a.l3{padding-left:26px;font-size:12.6px;color:var(--muted)}
  nav.toc a.l3:hover,nav.toc a.l3.on{color:var(--brand)}
  nav.toc .none{color:var(--muted);font-size:12.5px;padding:6px 12px}
  nav.toc .foot{padding:9px 14px;border-top:1px solid var(--line-2);font-size:11.8px;color:var(--muted);
    display:flex;gap:10px;flex-wrap:wrap}

  /* 正文卡 */
  main{flex:1 1 auto;min-width:0;background:var(--card);border:1px solid var(--line);
    border-radius:var(--radius);box-shadow:var(--shadow);padding:22px 42px 46px;overflow-wrap:break-word}
  main>*:first-child{margin-top:0}

  main h1{font-size:30px;line-height:1.28;letter-spacing:-.022em;font-weight:700;margin:0 0 12px}
  main h1+h2{border-top:0;padding-top:0;margin-top:16px}
  main h2{font-size:20px;line-height:1.45;letter-spacing:-.012em;font-weight:650;
    margin:40px 0 12px;padding-top:22px;border-top:1px solid var(--line-2);scroll-margin-top:88px}
  main h2:first-of-type{border-top:0;padding-top:0;margin-top:8px}
  main h3{font-size:16.5px;font-weight:650;margin:26px 0 8px;scroll-margin-top:88px}
  main h4{font-size:15px;font-weight:650;margin:20px 0 6px;color:var(--fg-2);scroll-margin-top:88px}
  main h2 .a,main h3 .a{opacity:0;margin-left:8px;color:var(--muted);font-weight:400;font-size:.85em;
    transition:.15s;text-decoration:none}
  main h2:hover .a,main h3:hover .a{opacity:1}
  main p{margin:11px 0;color:var(--fg-2)}
  main strong{color:var(--fg);font-weight:650}
  main li{color:var(--fg-2);margin:5px 0}
  main ul,main ol{padding-left:24px;margin:10px 0}
  main ul li::marker{color:var(--brand)}
  main ol li::marker{color:var(--muted);font-weight:600}

  /* 提示块 / 引用 */
  main blockquote{margin:14px 0;padding:12px 16px;border:1px solid var(--line);
    border-left:3px solid var(--brand);background:var(--brand-soft);border-radius:0 var(--radius-sm) var(--radius-sm) 0}
  main blockquote p{margin:4px 0;color:var(--fg-2);font-size:14.6px}
  main blockquote p:first-child{margin-top:0}
  main blockquote p:last-child{margin-bottom:0}

  /* 首段引用 = 文档元信息卡（版本 / 日期 / 网关 / 在线地址） */
  main blockquote.meta{padding:16px 18px 14px;border:1px solid color-mix(in srgb,var(--brand) 20%,var(--line));
    border-left:3px solid var(--brand);background:linear-gradient(180deg,var(--brand-soft),transparent 140%)}
  main blockquote.meta .mrow{display:flex;flex-wrap:wrap;gap:9px;align-items:center;margin:0 0 11px}
  main blockquote.meta .mrow:last-child{margin-bottom:0}
  main blockquote.meta .chip{display:inline-flex;align-items:center;gap:5px;font-size:12.6px;line-height:1.6;
    padding:2px 10px;border-radius:999px;background:var(--card);border:1px solid var(--line);color:var(--fg-2)}
  main blockquote.meta .chip b{color:var(--fg);font-weight:650}
  main blockquote.meta .chip.k{background:transparent;border-color:transparent;color:var(--muted);padding-left:0}
  main blockquote.meta .mline{font-size:14.2px;color:var(--fg-2);margin:9px 0 0;padding-top:10px;line-height:1.75;
    border-top:1px dashed var(--line-2)}
  main blockquote.meta .mline:first-child{border-top:0;padding-top:0;margin-top:0}
  main blockquote.meta code{background:var(--card)}
  main blockquote.meta a.lnk{display:inline-flex;align-items:center;gap:5px;font-size:13px;font-weight:500;
    padding:2px 9px;border-radius:999px;background:var(--card);border:1px solid var(--line);
    color:var(--brand);text-decoration:none;white-space:nowrap;cursor:pointer}
  main blockquote.meta a.lnk:hover{border-color:var(--brand);background:var(--brand-soft)}
  main blockquote.meta a.lnk i{font-style:normal;color:var(--muted);font-size:12px}
  main hr{border:0;border-top:1px solid var(--line-2);margin:34px 0;opacity:.8}

  /* 表格：圆角 + 表头吸顶 + 隔行 */
  .tblwrap{overflow-x:auto;margin:16px 0;border:1px solid var(--line);border-radius:var(--radius-sm);
    background:var(--card-2);scrollbar-width:thin}
  table{width:100%;border-collapse:separate;border-spacing:0;font-size:13.8px;min-width:520px}
  th,td{padding:10px 14px;text-align:left;vertical-align:top;border-bottom:1px solid var(--line-2)}
  td{line-height:1.7}
  th{position:sticky;top:0;background:var(--card-2);font-weight:650;color:var(--fg);white-space:nowrap;z-index:1;
    border-bottom:1px solid var(--line)}
  tbody tr:last-child td{border-bottom:0}
  tbody tr:nth-child(even) td{background:color-mix(in srgb,var(--bg) 55%,transparent)}
  tbody tr:hover td{background:var(--brand-soft)}
  td code{white-space:nowrap}

  /* 代码 */
  code{background:var(--code-bg);color:var(--code-fg);border:1px solid var(--line-2);
    padding:1.5px 6px;border-radius:6px;font:.86em/1.5 var(--mono)}
  main p code,main li code,main td code{font-size:12.9px}
  pre{position:relative;background:var(--code-bg);border:1px solid var(--line);border-radius:var(--radius-sm);
    padding:14px 16px;margin:14px 0;overflow:auto;scrollbar-width:thin}
  pre code{background:none;border:0;padding:0;display:block;font-size:13px;line-height:1.72;white-space:pre}
  pre .cp{position:absolute;top:8px;right:8px;font:12px var(--sans);padding:4px 10px;border-radius:999px;
    border:1px solid var(--line);background:var(--card);color:var(--muted);cursor:pointer;opacity:0;transition:.15s}
  pre:hover .cp{opacity:1}
  pre .cp:hover{color:var(--brand);border-color:var(--brand)}
  pre .cp.done{color:var(--ok);border-color:var(--ok);opacity:1}

  .load{color:var(--muted);padding:60px 0;text-align:center;font-size:14px}
  .foot{color:var(--muted);font-size:12.6px;margin-top:40px;padding-top:16px;border-top:1px solid var(--line-2)}

  /* 回到顶部 */
  #toTop{position:fixed;right:22px;bottom:24px;z-index:40;width:42px;height:42px;border-radius:50%;
    border:1px solid var(--line);background:var(--card);color:var(--fg-2);cursor:pointer;
    box-shadow:var(--shadow);font-size:17px;line-height:1;opacity:0;pointer-events:none;transition:.2s}
  #toTop.show{opacity:1;pointer-events:auto}
  #toTop:hover{color:var(--brand);border-color:var(--brand)}

  /* ========== 窄屏：单列、目录折叠 ========== */
  @media (max-width:1000px){
    .wrap{flex-direction:column;align-items:stretch;gap:16px;padding:18px 14px 80px}
    nav.toc{position:static;width:auto;max-width:100%;flex:none;max-height:none}
    main{width:auto;max-width:100%;padding:24px 20px 34px;border-radius:12px}
    nav.toc .list{max-height:44vh}
    main h1{font-size:24px}
    main h2{font-size:18px}
    #menuBtn{display:inline-flex}
    nav.toc.hide{display:none}
    #toTop{right:14px;bottom:16px}
  }
  @media (prefers-reduced-motion:reduce){html{scroll-behavior:auto}}
  @media print{
    header.top,nav.toc,#toTop,#prog{display:none}
    .wrap{display:block;padding:0;max-width:none}
    main{border:0;box-shadow:none;padding:0}
  }
</style>
</head>
<body>
<div id="prog"></div>

<header class="top">

      <h1>Qlike 中转站 API 接口说明</h1>
      <span class="ver" id="verTag"></span>
    </div>
    <span class="spacer"></span>
    <button class="tbtn" id="menuBtn" onclick="toggleToc()"><span class="i" id="menuIco">☰</span> 目录</button>
    <button class="tbtn" onclick="copyAll(this)"><span class="i">⧉</span> 复制全文</button>
    <a class="tbtn primary" href="/api-docs.md?download=1"><span class="i">⤓</span> 下载 Markdown</a>
    <a class="tbtn" href="/api-docs.md" target="_blank" rel="noopener"><span class="i">⌨</span> 源文件</a>
    <button class="tbtn" onclick="toggleTheme()" id="thBtn" title="切换浅色 / 深色"><span class="i">◐</span> <span id="thTxt">深色</span></button>
  </div>
</header>

<div class="wrap">
  <nav class="toc" id="tocCard">
    <div class="head">
      <div class="row"><span class="t">目录</span><span class="n" id="tocCount"></span></div>
      <input class="filter" id="tocSearch" type="search" placeholder="筛选章节…" autocomplete="off">
    </div>
    <div class="list" id="toc"></div>
    <div class="foot" id="tocFoot"></div>
  </nav>
  <main id="doc"><div class="load">文档加载中…</div></main>
</div>

<button id="toTop" onclick="toTop()" title="回到顶部" aria-label="回到顶部">↑</button>

<script>
let MD = '';
const $$ = (s, r = document) => Array.from(r.querySelectorAll(s));
const doc = document.getElementById('doc');

function slug(s) {
  return s.trim().toLowerCase().replace(/[^\w\u4e00-\u9fa5]+/g, '-').replace(/^-|-$/g, '') || 's';
}
function esc(s) {
  return String(s).replace(/[&<>"]/g, c => ({'&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;'}[c]));
}

function render() {
  marked.setOptions({ gfm: true, breaks: true });
  doc.innerHTML = marked.parse(MD);

  // 首段引用 → 文档元信息卡（版本 / 更新日期 / 适用网关 做成胶囊，长链接单独一行）
  const bq = doc.querySelector('blockquote');
  if (bq && /版本/.test(bq.textContent)) {
    const parts = bq.innerHTML.split(/<br\s*\/?>/i).map(x => x.trim()).filter(Boolean);
    const head = (parts.shift() || '').split('　').filter(Boolean)
      .map((x, i) => `<span class="chip${i ? '' : ' k'}">${x}</span>`).join('');
    // 长 URL 收进短标签：显示「域名/路径尾」，完整地址在 title 里，点一下复制
    const shorten = html => html.replace(/<code>(https?:\/\/[^<]+)<\/code>/g, (m, url) => {
      let label = url.replace(/^https?:\/\//, '').replace(/\?.*$/, '');
      if (label.length > 30) label = label.slice(0, 28) + '…';
      return `<a class="lnk" href="${url}" target="_blank" rel="noopener" title="${url}（点击打开 · 右键复制链接）">`
        + `${label} <i>↗</i></a>`;
    });
    bq.innerHTML = `<div class="mrow">${head}</div>`
      + parts.map(x => `<div class="mline">${shorten(x)}</div>`).join('');
    bq.classList.add('meta');
  }

  // 表格包一层，窄屏可横滑、圆角不裂
  $$('#doc table').forEach(t => {
    if (t.parentElement.classList.contains('tblwrap')) return;
    const w = document.createElement('div');
    w.className = 'tblwrap';
    t.parentNode.insertBefore(w, t);
    w.appendChild(t);
  });

  // 标题锚点 + 目录
  const toc = document.getElementById('toc');
  let items = [], n = 0;
  $$('#doc h2, #doc h3').forEach((h, i) => {
    const id = 'h' + i + '-' + slug(h.textContent);
    h.id = id;
    const lv = h.tagName === 'H3' ? 'l3' : '';
    const anchor = document.createElement('a');
    anchor.className = 'a'; anchor.href = '#' + id; anchor.textContent = '#';
    anchor.setAttribute('aria-label', '本节链接');
    h.appendChild(anchor);
    if (lv) n++;
    items.push(`<a class="${lv}" href="#${id}" data-t="${esc(h.textContent.replace(/#$/, ''))}">${esc(h.textContent.replace(/#$/, ''))}</a>`);
  });
  toc.innerHTML = items.join('') || '<div class="none">（无目录）</div>';
  document.getElementById('tocCount').textContent = items.length ? items.length + ' 节' : '';

  // 表格里的参数 / 地址：点一下即复制
  $$('#doc table code, #doc blockquote code').forEach(c => {
    c.style.cursor = 'copy';
    c.title = '点击复制';
    c.onclick = () => navigator.clipboard.writeText(c.innerText.trim()).then(() => {
      const t = c.innerText;
      c.innerText = '已复制 ✓';
      setTimeout(() => { c.innerText = t; }, 900);
    });
  });

  // 代码块复制（异步渲染的 marked 产物已就位）
  $$('#doc pre').forEach(pre => {
    const b = document.createElement('button');
    b.className = 'cp'; b.type = 'button'; b.textContent = '复制';
    b.onclick = () => {
      const code = pre.querySelector('code') || pre;
      const txt = code.innerText.replace(/\n?复制$/, '');
      navigator.clipboard.writeText(txt).then(() => {
        b.textContent = '已复制'; b.classList.add('done');
        setTimeout(() => { b.textContent = '复制'; b.classList.remove('done'); }, 1300);
      });
    };
    pre.appendChild(b);
  });

  const m = /^>\s*\*\*版本\*\*：(\S+)/m.exec(MD);
  document.getElementById('verTag').textContent = m ? m[1] : '';

  // 页脚信息
  const words = MD.replace(/\s/g, '').length;
  document.getElementById('tocFoot').innerHTML =
    `<span>${items.length} 节 · 约 ${words} 字</span><span style="margin-left:auto">更新见文末</span>`;

  buildSpy();
}

/* 滚动高亮 + 阅读进度 + 回到顶部 */
function buildSpy() {
  const links = $$('#toc a[data-t]');
  const heads = $$('#doc h2, #doc h3');
  const onScroll = () => {
    const y = window.scrollY + 100;
    let cur = null;
    heads.forEach(h => { if (h.offsetTop <= y) cur = h.id; });
    links.forEach(a => a.classList.toggle('on', cur && a.getAttribute('href') === '#' + cur));
    const total = document.documentElement.scrollHeight - window.innerHeight;
    document.getElementById('prog').style.width = (total > 0 ? Math.min(100, window.scrollY / total * 100) : 0) + '%';
    document.getElementById('toTop').classList.toggle('show', window.scrollY > 600);
  };
  window.removeEventListener('scroll', window.__spy || (() => {}));
  window.__spy = onScroll;
  window.addEventListener('scroll', onScroll, { passive: true });
  onScroll();
}

/* 目录筛选 */
document.getElementById('tocSearch').addEventListener('input', e => {
  const q = e.target.value.trim().toLowerCase();
  $$('#toc a[data-t]').forEach(a => {
    a.style.display = !q || a.dataset.t.toLowerCase().includes(q) ? '' : 'none';
  });
});

/* 目录显隐（窄屏） */
function toggleToc() {
  const c = document.getElementById('tocCard');
  c.classList.toggle('hide');
  document.getElementById('menuIco').textContent = c.classList.contains('hide') ? '☰' : '✕';
}

function toTop() { window.scrollTo({ top: 0, behavior: 'smooth' }); }

function copyAll(btn) {
  navigator.clipboard.writeText(MD).then(() => {
    const o = btn.innerHTML;
    btn.innerHTML = '<span class="i">✓</span> 已复制';
    setTimeout(() => btn.innerHTML = o, 1300);
  });
}

/* 主题：跟随系统 → 手动切换后记住 */
function applyTheme(dark, save) {
  document.body.classList.toggle('dark', dark);
  document.getElementById('thTxt').textContent = dark ? '浅色' : '深色';
  if (save) { try { localStorage.setItem('ql_docs_theme', dark ? 'dark' : 'light'); } catch (e) {} }
}
function toggleTheme() { applyTheme(!document.body.classList.contains('dark'), true); }
(function initTheme() {
  let saved = null;
  try { saved = localStorage.getItem('ql_docs_theme'); } catch (e) {}
  const dark = saved ? saved === 'dark'
    : (window.matchMedia && matchMedia('(prefers-color-scheme: dark)').matches);
  applyTheme(dark, false);
})();

fetch('/api-docs.md', { cache: 'no-cache' })
  .then(r => r.text())
  .then(t => { MD = t; render(); })
  .catch(e => { doc.innerHTML = '<div class="load">文档加载失败：' + esc(e) + '</div>'; });
</script>
</body>
</html>
