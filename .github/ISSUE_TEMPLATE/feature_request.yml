name: 功能建议
description: 提出一个新能力或改进（含新的渠道插件）
title: "[Feature] "
labels: ["enhancement"]
body:
  - type: markdown
    attributes:
      value: |
        请先说清「要解决什么问题」，再说「想要什么功能」。
        路线图里的「明确不做」条目（用户体系 / 拼车池 / 语义缓存 等）通常不会接受，
        见 [docs/ROADMAP.md](../blob/main/docs/ROADMAP.md)。

  - type: textarea
    id: problem
    attributes:
      label: 你要解决的问题
      placeholder: |
        我的上游 A 只支持 xxxx 协议，现在得手工转一次格式才能用 …
    validations:
      required: true

  - type: textarea
    id: current
    attributes:
      label: 现在的做法为什么不行
      placeholder: 现在的 workaround 是 …，问题是 …
    validations:
      required: true

  - type: textarea
    id: proposal
    attributes:
      label: 期望的方案
      description: 接口形状 / 控制台交互 / 配置项长什么样；有替代方案也一并说
    validations:
      required: true

  - type: dropdown
    id: kind
    attributes:
      label: 类型
      options:
        - 新渠道插件（新上游协议）
        - 路由 / 熔断 / 故障切换
        - 控制台界面与交互
        - 配置与部署
        - 文档
        - 其它
    validations:
      required: true

  - type: checkboxes
    id: contribute
    attributes:
      label: 参与意愿
      options:
        - label: 我愿意提 PR（可以先开 issue 对齐设计）
          required: false
