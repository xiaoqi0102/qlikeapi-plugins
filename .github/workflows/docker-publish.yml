name: Docker 镜像发布（GHCR）

# 什么时候推：打 v* 标签时自动推；也可以在 Actions 页面手动跑（可指定 ref，比如某个 tag）
on:
  push:
    tags: ["v*"]
  workflow_dispatch:
    inputs:
      version:
        description: "手动补推时给镜像打的版本标签（如 v3.15.1；留空则只打 sha-xxxx）"
        required: false
        default: ""

concurrency:
  group: publish-${{ github.ref }}
  cancel-in-progress: false

env:
  REGISTRY: ghcr.io
  IMAGE_NAME: ${{ github.repository }}

jobs:
  publish:
    name: 构建并推送到 GHCR
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write # 推 ghcr.io 需要这个（用 Actions 自带 token，不占用户的 PAT 权限）
    steps:
      - uses: actions/checkout@v5

      - name: 生成镜像标签/元数据
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}
          tags: |
            # 打 v* 标签自动触发时：从标签名推导 3.15.1 / 3.15 / v3.15.1 / latest
            type=semver,pattern={{version}}
            type=semver,pattern={{major}}.{{minor}}
            type=ref,event=tag
            type=raw,value=latest,enable=${{ startsWith(github.ref, 'refs/tags/v') }}
            # 手动补推（workflow_dispatch 传 version=v3.15.1）时：同样推导出 3.15.1 / 3.15 / latest
            type=semver,pattern={{version}},value=${{ inputs.version }},enable=${{ inputs.version != '' }}
            type=semver,pattern={{major}}.{{minor}},value=${{ inputs.version }},enable=${{ inputs.version != '' }}
            type=raw,value=latest,enable=${{ inputs.version != '' }}
            type=raw,value=${{ inputs.version }},enable=${{ inputs.version != '' }}
            type=sha,prefix=sha-,format=short
          labels: |
            org.opencontainers.image.title=qlikeapi-plugins
            org.opencontainers.image.description=图片协议转换网关（客户端 → New API 唯一渠道 → 本网关 → 各生图渠道商）
            org.opencontainers.image.licenses=MIT

      - uses: docker/setup-buildx-action@v3

      - name: 登录 GHCR
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: 构建并推送
        uses: docker/build-push-action@v6
        with:
          context: .
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: 冒烟：拉回来跑一遍，确认 /healthz 通且版本号对得上
        run: |
          set -e
          FIRST_TAG=$(echo "${{ steps.meta.outputs.tags }}" | head -n1)
          echo "拉取 $FIRST_TAG"
          docker pull "$FIRST_TAG"
          docker run -d --name smoke -p 18673:18673 \
            -e QLIKEAPI_SECRET=ci-secret-not-real \
            -e QLIKEAPI_UP_TOKEN=ci-master-not-real \
            -e QLIKEAPI_ADMIN_PASS=ci-pass-not-real \
            -e QLIKEAPI_DB=/tmp/ci.db \
            "$FIRST_TAG"
          for i in $(seq 1 30); do
            if curl -fsS http://127.0.0.1:18673/healthz > /tmp/h.json; then break; fi
            sleep 1
          done
          cat /tmp/h.json
          grep -q '"ok":true' /tmp/h.json
          docker logs smoke | tail -10

      - name: 汇总
        run: |
          {
            echo "### 镜像已推送 ✅"
            echo
            echo '```'
            echo "${{ steps.meta.outputs.tags }}"
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"
